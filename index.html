    <style>
      #app-startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fcfcfe !important;
        color-scheme: only light;
        forced-color-adjust: none;
        contain: strict;
        isolation: isolate;
        transition: opacity 160ms ease-out;
      }

      #app-startup-splash.is-exiting {
        opacity: 0;
        pointer-events: none;
      }

      .app-startup-splash__graphic {
        display: block;
        width: min(68vw, 68dvh, 620px);
        height: min(68vw, 68dvh, 620px);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        animation: app-startup-enter 1.2s cubic-bezier(.2, .8, .2, 1) both;
      }

      .app-startup-splash__gif {
        display: block;
        width: min(68vw, 68dvh, 620px);
        height: min(68vw, 68dvh, 620px);
        object-fit: contain;
        background: #fcfcfe;
        filter: none !important;
        mix-blend-mode: normal;
        forced-color-adjust: none;
      }

      #app-startup-splash > .app-startup-splash__graphic {
        display: none;
      }

      @keyframes app-startup-enter {
        0% { opacity: 0; transform: translate3d(0, 36px, 0) scale(.94); }
        24% { opacity: 1; }
        72% { transform: translate3d(0, -5px, 0) scale(1.01); }
        100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-startup-splash__graphic {
          animation-duration: 250ms;
        }
      }
    </style>
  </head>

    <div id="root"></div>
    <script>
      (() => {
        const splash = document.getElementById('app-startup-splash');
        const animation = document.getElementById('app-startup-animation');
        if (!splash) return;

        let animationDone = false;
        let appReady = false;
        let closed = false;

        const close = () => {
          if (closed) return;
          closed = true;
          splash.classList.add('is-exiting');
          window.setTimeout(() => splash.remove(), 180);
        };

        const closeWhenReady = () => {
          if (animationDone && appReady) close();
        };

        const markAnimationDone = () => {
          const duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 250 : 1320;
          window.setTimeout(() => {
            animationDone = true;
            closeWhenReady();
          }, duration);
        };

        if (animation instanceof HTMLImageElement) {
          if (animation.complete) markAnimationDone();
          else animation.addEventListener('load', markAnimationDone, { once: true });
        } else {
          markAnimationDone();
        }

        window.addEventListener('galwriter:app-ready', () => {
          appReady = true;
          closeWhenReady();
        }, { once: true });

        window.setTimeout(close, 5000);
      })();
    </script>
