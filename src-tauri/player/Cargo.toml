[package]
name = "galwriter-player"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }
ring = "0.17"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
percent-encoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
