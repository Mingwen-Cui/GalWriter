<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BGM boundary test</title>
  <link rel="icon" href="./icons/logo.png" />
  <script src="./content.js"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #10131a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }
    button { font: inherit; }
    .gw-flow-control { border: 0 !important; border-radius: 9999px !important; background: #f1f5f9 !important; color: #475569 !important; }
    .gw-flow-control:hover { background: #e2e8f0 !important; color: #334155 !important; }
    .gw-flow-control-content > svg { display: block; width: 24px !important; height: 24px !important; max-width: 72%; max-height: 72%; flex-shrink: 0; }
    .canvas-shell {
      border-radius: 0;
      position: fixed;
      left: 50%;
      top: 50%;
      overflow: hidden;
      transform-origin: center center;
    }
    .app {
      border-radius: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.20), rgba(15, 23, 42, 0.84)),
        #10131a;
    }
    /* The overlay toolbar does not occupy a grid row. Reserve the full canvas for the story. */
    .app.immersive {
      grid-template-rows: minmax(0, 1fr);
    }
    .app.has-playback-toolbar { grid-template-rows: minmax(0, 1fr); }
    .playback-toolbar { position: absolute; inset: 0; z-index: 200; pointer-events: none; }
    .playback-toolbar .start-element { pointer-events: auto; }
    .playback-toolbar .start-element-button { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .playback-toolbar svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .playback-toolbar button:disabled { opacity: .35; cursor: default; }
    .playback-toolbar button[aria-pressed=true] { outline: 1px solid #7dd3fc; outline-offset: -1px; }
    .app.immersive header {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 5;
      // border-bottom: 0;
      // background: linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.34), transparent);
      // box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }
    .app.controls-hidden header {
      opacity: 0;
      pointer-events: none;
    }
    header {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      // border-bottom: 1px solid rgba(255,255,255,0.12);
      // background: rgba(10, 13, 20, 0.52);
      // backdrop-filter: blur(16px);
      transition: opacity 180ms ease;
    }
    h1 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0;
      text-overflow: ellipsis;
      text-shadow: none;
      white-space: nowrap;
    }
    .toolbar { margin-left: auto; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .tool {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: #f8fafc;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
    }
    .tool img { width: 18px; height: 18px; display: block; }
    .tool:disabled { opacity: 0.4; cursor: not-allowed; }
    .playlist-wrap { position: relative; }
    .playlist-backdrop {
      position: absolute;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: 24px 16px;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(4px);
    }
    .playlist-backdrop.open { display: grid; }
    .playlist-panel {
      width: min(880px, 100%);
      height: min(680px, 100%);
      display: flex;
      flex-direction: column;
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #fff;
      color: #0f172a;
      box-shadow: 0 24px 70px rgba(15,23,42,0.2);
    }
    .playlist-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .playlist-title { font-size: 18px; font-weight: 900; }
    .playlist-hint { margin-top: 3px; color: #64748b; font-size: 12px; }
    .playlist-close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .playlist-close:hover { background: #f1f5f9; color: #0f172a; }
    .playlist-items { min-height: 0; flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 8px; }
    .playlist-empty {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px dashed #e2e8f0;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
    }
    .playlist-item {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: var(--choice-gap, 10px);
      width: var(--choice-width, 100%);
      left: var(--choice-left, auto);
      top: var(--choice-top, auto);
      min-height: var(--choice-height, 0px);
      transform: var(--choice-transform, none);
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
    }
    .playlist-item.active { border-color: #a5b4fc; background: #eef2ff; }
    .playlist-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    .playlist-play {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
    }
    .playlist-play:hover { background: #6366f1; }
    main {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0;
      overflow: hidden;
    }
    .app.immersive main {
      grid-row: 1;
      width: 100%;
      height: 100%;
      padding: 0;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      opacity: 0.72;
      transition: background-image 180ms ease, opacity 180ms ease;
    }
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8,11,18,0.25), rgba(8,11,18,0.72));
    }
    .app.immersive .backdrop { display: none; }
    .stage {
      position: relative;
      isolation: isolate;
      z-index: 1;
      width: 100%;
      height: 100%;
      max-height: none;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      border: 0;
      background: transparent;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
      backdrop-filter: blur(18px);
    }
    .app.immersive .stage {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    .app.immersive .media {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .media {
      position: relative;
      min-height: 0;
      z-index: 0;
      width: fit-content;
      height: fit-content;
      max-width: calc(100% - clamp(28px, 5vw, 48px));
      max-height: calc(100% - clamp(28px, 5vw, 48px));
      place-self: center;
      display: inline-grid;
      place-items: center;
      margin: 0;
      background: rgba(0,0,0,0.24);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .presentation-scale {
      position: relative;
      display: inline-grid;
      place-items: center;
      transform-origin: center;
    }
    .app.immersive .presentation-scale {
      width: 100%;
      height: 100%;
    }
    .scene-image {
      position: relative;
      z-index: 1;
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, calc(100vw - clamp(28px, 5vw, 48px)));
      max-height: calc(100vh - 220px);
      object-fit: contain;
    }
    .presentation-scale > video {
      position: relative;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .app.immersive .scene-image,
    .app.immersive .presentation-scale > video {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
    }
    .media.empty { color: rgba(248,250,252,0.42); font-weight: 700; }
    .characters-layer {
      container-type: size;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .character-img {
      position: absolute;
      max-height: 92%;
      max-width: 72%;
      width: auto;
      object-fit: contain;
      object-position: bottom;
      transform-origin: center center;
    }
    .nameplate-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      overflow: visible;
    }
    .nameplate-layer.inside {
      position: relative;
      inset: auto;
      min-height: var(--nameplate-row-height, 50px);
      margin-bottom: var(--nameplate-text-gap, 8px);
    }
    .nameplate-anchor {
      position: absolute;
      left: var(--dialog-left, 0px);
      top: var(--dialog-top, 0px);
      width: var(--dialog-width, 86%);
      height: var(--dialog-height, 34vh);
      z-index: 8;
      pointer-events: none;
      overflow: visible;
      transform: var(--dialog-object-transform, none);
    }
    .nameplate {
      position: absolute;
      top: var(--nameplate-top, 0);
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--nameplate-width, 108px);
      height: var(--nameplate-height, 38px);
      max-width: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: var(--nameplate-padding-y, 8px) var(--nameplate-padding-x, 18px);
      border-radius: var(--nameplate-radius, 12px);
      background: var(--nameplate-background, rgba(79, 70, 229, 0.86));
      color: var(--nameplate-color, #fff);
      font-family: var(--nameplate-font-family, var(--title-font-family, sans-serif));
      font-size: var(--nameplate-font-size, 18px);
      font-weight: 800;
      line-height: 1;
      border: var(--nameplate-border, 1px solid rgba(214,222,232,0.24));
      box-shadow: var(--nameplate-shadow, none);
      text-shadow: none;
      transform: translate(calc(-50% + var(--nameplate-offset-x, 0px) + var(--nameplate-fixed-x, 0px)), calc(var(--nameplate-translate-y, -100%) + var(--nameplate-fixed-y, 0px) + var(--nameplate-character-y, 0px))) var(--nameplate-object-transform, rotate(0deg) scale(1, 1));
    }
    .nameplate-layer.inside .nameplate {
      background: transparent;
      border: none;
      box-shadow: none;
      text-shadow: none;
      transform: translate(calc(-50% + var(--nameplate-offset-x, 0px) + var(--nameplate-fixed-x, 0px)), calc(var(--nameplate-offset-y, 0px) + var(--nameplate-fixed-y, 0px) + var(--nameplate-character-y, 0px)));
    }
    .dialogue {
      position: absolute;
      left: var(--dialog-left, 0px);
      top: var(--dialog-top, 0px);
      z-index: 3;
      box-sizing: border-box;
      width: var(--dialog-width, 86%);
      display: block;
      border-top: 1px solid var(--dialog-border-color, rgba(255,255,255,0.14));
      height: var(--dialog-height, 34vh);
      padding: 20px var(--dialog-padding-x, 9%);
      background: var(--dialog-background, rgba(7, 10, 16, 0.82));
      border-radius: var(--dialog-radius, 12px);
      box-shadow: var(--dialog-shadow, none);
      backdrop-filter: var(--dialog-backdrop-filter, none);
      overflow: auto;
      transform: var(--dialog-object-transform, none);
    }
    .app.immersive .dialogue {
      position: absolute;
      left: var(--dialog-left, 50%);
      top: var(--dialog-top, 0px);
      z-index: 4;
      margin: 0;
      width: var(--dialog-width, 86%);
      height: var(--dialog-height, 34vh);
      padding: 20px var(--dialog-padding-x, 9%);
      transform: var(--dialog-object-transform, rotate(0deg) scale(1, 1));
      border: var(--dialog-border-width, 1px) solid var(--dialog-border-color, rgba(255,255,255,0.12));
      border-radius: var(--dialog-radius, 12px);
      background: var(--dialog-background, rgba(7, 10, 16, 0.82));
      box-shadow: var(--dialog-shadow, none);
      backdrop-filter: var(--dialog-backdrop-filter, blur(18px));
    }
    .title {
      margin: 0 0 8px;
      color: transparent;
      background: var(--title-fill, var(--title-color, #f8fafc));
      -webkit-background-clip: text;
      background-clip: text;
      font-size: var(--title-size, 18px);
      font-family: var(--title-font-family, inherit);
      font-weight: 900;
      width: var(--title-width, auto);
      height: var(--title-height, auto);
      line-height: var(--title-line-height, 1.18);
      letter-spacing: var(--title-letter-spacing, 0px);
      text-align: var(--title-align, left);
      -webkit-text-stroke: var(--title-stroke, 0 transparent);
      text-shadow: var(--title-shadow, none);
      overflow-wrap: anywhere;
      transform: var(--title-transform, none);
    }
    .text {
      color: transparent;
      background: var(--body-fill, var(--body-color, #e5e7eb));
      -webkit-background-clip: text;
      background-clip: text;
      font-family: var(--body-font-family, inherit);
      width: var(--body-width, auto);
      height: var(--body-height, auto);
      line-height: var(--body-line-height, 1.55);
      font-size: var(--body-size, 16px);
      letter-spacing: var(--body-letter-spacing, 0px);
      text-align: var(--body-align, left);
      -webkit-text-stroke: var(--body-stroke, 0 transparent);
      text-shadow: var(--body-shadow, none);
      overflow-wrap: anywhere;
      transform: var(--body-transform, none);
    }
    .text.typewriter-reserved { position: relative; }
    .typewriter-placeholder {
      display: block;
      visibility: hidden;
      white-space: pre-wrap;
    }
    .typewriter-visible {
      position: absolute;
      inset: 0;
      display: block;
      white-space: pre-wrap;
    }
    .zen-toggle {
      position: absolute;
      right: 24px;
      bottom: var(--zen-toggle-bottom, 24px);
      z-index: 18;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.44);
      color: #f8fafc;
      box-shadow: 0 18px 48px rgba(0,0,0,0.28);
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .zen-toggle:hover { background: rgba(0,0,0,0.62); }
    .zen-toggle img { width: 20px; height: 20px; display: block; margin: auto; }
    .text :first-child { margin-top: 0; }
    .text :last-child { margin-bottom: 0; }
    .choices {
      display: grid;
      position: relative;
      z-index: 4;
      gap: 10px;
      margin-top: 18px;
    }
    .choices.above { margin-bottom: 14px; margin-top: 0; }
    .choices.center {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: min(520px, calc(100% - 32px));
      max-height: min(62vh, 420px);
      transform: var(--choice-transform, translate(-50%, -50%));
      margin: 0;
    }
    .choice {
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--choice-color, #0ea5e9), white 25%);
      background: color-mix(in srgb, var(--choice-color, #0ea5e9), transparent 20%);
      color: var(--choice-text-color, #ffffff);
      border-radius: var(--choice-radius, 8px);
      min-height: var(--choice-button-height, 40px);
      padding: 12px 14px;
      text-align: left;
      line-height: var(--choice-line-height, 1.35);
      font-family: var(--choice-font-family, inherit);
      font-size: var(--choice-font-size, inherit);
      font-weight: var(--choice-font-weight, 700);
      letter-spacing: var(--choice-letter-spacing, normal);
      box-shadow: var(--choice-shadow, none);
      background: var(--choice-background, color-mix(in srgb, var(--choice-color, #0ea5e9), transparent 20%));
      border-color: var(--choice-border-color, color-mix(in srgb, var(--choice-color, #0ea5e9), white 25%));
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .choice:hover {
      background: color-mix(in srgb, var(--choice-color, #0ea5e9), transparent 68%);
      border-color: color-mix(in srgb, var(--choice-color, #0ea5e9), white 52%);
    }
    .anim-fade { animation: fadeIn calc(360ms / var(--player-animation-speed, 1)) ease both; }
    .anim-slideUp { animation: slideUp calc(360ms / var(--player-animation-speed, 1)) ease both; }
    .anim-typewriter { animation: fadeIn calc(180ms / var(--player-animation-speed, 1)) ease both; }
    .inline-shake-x { animation: inlineShakeX var(--inline-action-step-duration, 400ms) ease var(--inline-action-count, 1) both; }
    .inline-shake-y { animation: inlineShakeY var(--inline-action-step-duration, 400ms) ease var(--inline-action-count, 1) both; }
    .inline-pulse { animation: inlinePulse var(--inline-action-step-duration, 400ms) ease var(--inline-action-count, 1) both; }
    .inline-rotate { animation: inlineRotate var(--inline-action-duration, 400ms) ease both; }
    .inline-opacity { animation: inlineOpacity var(--inline-action-duration, 400ms) ease both; }
    .inline-brightness { animation: inlineBrightness var(--inline-action-duration, 400ms) ease both; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes inlineShakeX {
      0%, 100% { translate: 0 0; }
      20% { translate: calc(var(--inline-action-strength, 14px) * -1) 0; }
      40% { translate: var(--inline-action-strength, 14px) 0; }
      60% { translate: calc(var(--inline-action-strength, 14px) * -0.7) 0; }
      80% { translate: calc(var(--inline-action-strength, 14px) * 0.7) 0; }
    }
    @keyframes inlineShakeY {
      0%, 100% { translate: 0 0; }
      20% { translate: 0 calc(var(--inline-action-strength, 14px) * -1); }
      40% { translate: 0 var(--inline-action-strength, 14px); }
      60% { translate: 0 calc(var(--inline-action-strength, 14px) * -0.7); }
      80% { translate: 0 calc(var(--inline-action-strength, 14px) * 0.7); }
    }
    @keyframes inlinePulse {
      0%, 100% { opacity: 1; filter: brightness(1); }
      45% { opacity: var(--inline-action-opacity, .45); filter: brightness(var(--inline-action-brightness, 1.35)); }
    }
    @keyframes galInlineSwitch { from { opacity: 0; } to { opacity: var(--inline-switch-opacity, 1); } }
    @keyframes inlineRotate {
      0% { rotate: 0deg; }
      45% { rotate: var(--inline-action-rotation, 12deg); }
      72% { rotate: calc(var(--inline-action-rotation, 12deg) * -0.65); }
      100% { rotate: var(--inline-action-rotation, 12deg); }
    }
    @keyframes inlineOpacity {
      0% { opacity: 1; }
      100% { opacity: var(--inline-action-opacity, 0.45); }
    }
    @keyframes inlineBrightness {
      0% { filter: brightness(1); }
      100% { filter: brightness(var(--inline-action-brightness, 0.7)); }
    }
    .end {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      text-align: center;
      color: #e2e8f0;
      font-size: 24px;
      font-weight: 900;
    }
    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 10000;
      display: none;
      place-items: center;
      padding: clamp(20px, 6vw, 64px);
      background:
        linear-gradient(180deg, rgba(4, 8, 14, 0.42), rgba(4, 8, 14, 0.92)),
        radial-gradient(circle at 50% 22%, rgba(14, 165, 233, 0.22), transparent 42%),
        #070b12;
      color: #f8fafc;
    }
    .start-screen.template-minimal {
      background:
        linear-gradient(180deg, rgba(2,6,23,0.24), rgba(2,6,23,0.94)),
        #020617;
    }
    .start-screen.template-glass {
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.64), rgba(8, 145, 178, 0.28)),
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.18), transparent 34%),
        #07111f;
    }
    .start-screen.open { display: grid; }
    .start-screen.has-custom-elements {
      padding: 0;
      place-items: stretch;
    }
    .start-panel {
      width: min(440px, 100%);
      display: grid;
      gap: 20px;
      text-align: center;
    }
    .start-screen.buttons-bottom-left,
    .start-screen.buttons-bottom-right {
      align-items: end;
    }
    .start-screen.buttons-bottom-left {
      justify-items: start;
    }
    .start-screen.buttons-bottom-right {
      justify-items: end;
    }
    .start-screen.buttons-bottom-left .start-panel,
    .start-screen.buttons-bottom-right .start-panel {
      max-width: min(380px, 100%);
      text-align: left;
    }

/* A short white-light wipe for scene material switches. Screen blending keeps
   the supplied black backing transparent while preserving the photographed glow. */
.gal-scene-switch-flash {
  position: absolute;
  top: 50%;
  left: 0;
  z-index: 31;
  width: 58%;
  height: 156%;
  max-width: none;
  pointer-events: none;
  user-select: none;
  object-fit: contain;
  mix-blend-mode: screen;
  filter: brightness(1.25) saturate(0.7);
  /* left and the reveal mask share one easing curve; opacity has its own clock. */
  transform: translate(-50%, -50%);
  animation:
    galSceneSwitchTravel var(--scene-switch-flash-duration, 420ms) cubic-bezier(0.2, 0.72, 0.25, 1)
      both,
    galSceneSwitchFlash var(--scene-switch-flash-duration, 420ms) linear both;
}

.gal-scene-switch-reveal {
  position: absolute;
  inset: 0;
  z-index: 20;
  overflow: hidden;
  pointer-events: none;
  clip-path: inset(0 100% 0 0);
  animation: galSceneSwitchReveal var(--scene-switch-flash-duration, 420ms)
    cubic-bezier(0.2, 0.72, 0.25, 1) both;
}

@keyframes galSceneSwitchReveal {
  from {
    clip-path: inset(0 100% 0 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

@keyframes galSceneSwitchFlash {
  0% {
    opacity: 0;
  }
  10% {
    opacity: 0.88;
  }
  58% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

@keyframes galSceneSwitchTravel {
  from {
    left: 0%;
  }
  to {
    left: 100%;
  }
}

    function numberConditionTarget(node) {
      const data = node.data || {};
      const sum = currentHistoryTotal();
      const ranges = Array.isArray(data.ranges) ? data.ranges : [];
      const matchedRange = ranges.find((range) =>
        range && range.min <= range.max && sum >= range.min && sum <= range.max

      const sourceHandle = matchedRange
        ? "out-range-" + matchedRange.id
        : sum >= (Number(data.threshold) || 0)
          ? "out-greater"

            return;

        };
        const options = { capture: true, passive: true };
        window.addEventListener("pointerdown", retry, options);
        window.addEventListener("keydown", retry, options);
        window.addEventListener("touchend", retry, options);

      if (sceneAmbientAudio && sceneAmbientKey === nextKey) {
        sceneAmbientAudio.loop = sound.loop !== false;
        sceneAmbientAudio.volume = Math.max(0, Math.min(1, Number(sound.volume) || 0));
        if (sceneAmbientAudio.paused) sceneAmbientAudio.play().catch(() => {});
        return;
      }
      const previous = sceneAmbientAudio;
      const startNext = () => {
        if (!nextKey) return;
        const audio = new Audio(nextKey);
        audio.muted = !settings.soundEnabled;
        sceneAmbientAudio = audio;
        sceneAmbientKey = nextKey;
        audio.loop = sound.loop !== false;
        audio._fadeOut = Math.max(0, Number(sound.fadeOut) || 0);
        const targetVolume = Math.max(0, Math.min(1, Number(sound.volume) || 0));
        audio.volume = Number(sound.fadeIn) > 0 ? 0 : targetVolume;
        audio.play().catch(() => {});
        fadeSceneAmbient(audio, audio.volume, targetVolume, sound.fadeIn);
      };
      if (!previous) {
        startNext();
        return;
      }
      fadeSceneAmbient(previous, previous.volume, 0, previous._fadeOut || 0, () => {
        previous.pause();
        if (sceneAmbientAudio === previous) {
          sceneAmbientAudio = null;
          sceneAmbientKey = "";
        }
        startNext();
      });
    }

    function nodeTitle(node) {
      return (node && node.data && node.data.title) || labels.option;
    }

    function audioTitle(node) {
      if (node && node.data && node.data.title) return String(node.data.title);
      const temp = document.createElement("div");
      temp.innerHTML = node && node.data && node.data.text || "";
      const text = (temp.textContent || "").trim().replace(/\s+/g, " ");
      return text ? text.slice(0, 42) : labels.untitledAudio;

    function renderPlaylist() {

      return content.edges.filter((edge) => edge.source === id);

    function flowNodeText(node) {
      const data = node && node.data ? node.data : {};

    function flowNodeTitle(node) {
      const data = node && node.data ? node.data : {};
      return String(data.title || data.name || data.label || node?.id || "Untitled");

    let flowOverviewRootNodeId = "";
    let flowOverviewEdges = [];
    let flowOverviewLayoutDirection = settings.flowOverviewLayoutDirection || "right";
    let flowOverviewBranchLabel = "";

    function cycleFlowOverviewDirection() {
      const directions = ["right", "down", "left", "up"];
      const currentIndex = directions.indexOf(flowOverviewLayoutDirection);
      flowOverviewLayoutDirection = directions[(currentIndex + 1) % directions.length];
      if (flowOverviewBackdrop.classList.contains("open")) openFlowOverview();

    function applyFlowTransform() {
      flowOverviewCanvas.style.transform = "translate(" + flowPan.x + "px, " + flowPan.y + "px) scale(" + flowOverviewZoom + ")";
      updateFlowOverviewMinimap();
    }

    function setFlowOverviewZoom(value, resetPan, anchorX = flowGraphRegion.clientWidth / 2, anchorY = flowGraphRegion.clientHeight / 2) {
      const zoom = clamp(value, settings.flowOverviewView.minZoom, settings.flowOverviewView.maxZoom, 1);
      const ratio = zoom / flowOverviewZoom;
      flowPan = resetPan ? { x: 0, y: 0 } : { x: anchorX - (anchorX - flowPan.x) * ratio, y: anchorY - (anchorY - flowPan.y) * ratio };
      flowOverviewZoom = zoom;
      applyFlowTransform();
      if (flowOverviewZoomIn) flowOverviewZoomIn.disabled = flowOverviewZoom >= settings.flowOverviewView.maxZoom;
      if (flowOverviewZoomOut) flowOverviewZoomOut.disabled = flowOverviewZoom <= settings.flowOverviewView.minZoom;
    }

    function fitFlowOverview() {
      const availableWidth = Math.max(1, flowGraphRegion.clientWidth - 112);
      const availableHeight = Math.max(1, flowGraphRegion.clientHeight - 112);
      const canvasWidth = Math.max(1, flowOverviewCanvas.scrollWidth || flowOverviewCanvas.clientWidth);
      const canvasHeight = Math.max(1, flowOverviewCanvas.scrollHeight || flowOverviewCanvas.clientHeight);
      setFlowOverviewZoom(Math.min(availableWidth / canvasWidth, availableHeight / canvasHeight), true);
      flowPan = { x: (flowGraphRegion.clientWidth - canvasWidth * flowOverviewZoom) / 2, y: (flowGraphRegion.clientHeight - canvasHeight * flowOverviewZoom) / 2 };
      applyFlowTransform();
    }

    function flowPathNodeIds(targetId) {
      if (!targetId) return new Set();
      const parents = new Map();
      const visited = new Set([flowOverviewRootNodeId]);
      const queue = [flowOverviewRootNodeId];
      while (queue.length) {
        const source = queue.shift();
        flowOverviewEdges.forEach((edge) => {
          if (edge.source !== source || visited.has(edge.target)) return;
          visited.add(edge.target);
          parents.set(edge.target, source);
          queue.push(edge.target);
        });
      }
      const path = new Set([targetId]);
      let current = targetId;
      const guard = new Set();
      while (parents.has(current) && !guard.has(current)) {
        guard.add(current);
        current = parents.get(current);
        path.add(current);
      }
      return path;
    }

    function highlightFlowPath(targetId) {
      const path = flowPathNodeIds(targetId);
      flowOverviewCanvas.querySelectorAll(".flow-overview-node").forEach((card) => {
        card.classList.toggle("is-chain", path.has(card.getAttribute("data-node-id")));
      });
      flowOverviewCanvas.querySelectorAll(".flow-overview-edge").forEach((edge) => {
        edge.classList.toggle(
          "is-chain",
          path.has(edge.getAttribute("data-source")) && path.has(edge.getAttribute("data-target")),
        );
      });
    }

      startGameFromCurrent();
      writeSave();
    }

    function showFlowNodeDetail(node) {
      if (!node) return;

      flowOverviewActiveNodeId = flowNode?.id || node.id;

      flowOverviewBranchLabel = flowNodeTitle(node);

      highlightFlowPath(flowOverviewActiveNodeId);
      const nextEdges = outEdges(node.id);
      flowOverviewDetail.hidden = false;

    function flowOverviewEdgePath(from, to) {
      return segmentLinkPath(from, to, from.width || 220, from.height || 132, flowOverviewLayoutDirection, 28, to.width || 220, to.height || 132);
    }

    function updateFlowOverviewMinimap() {
      if (!flowMinimapSvg || !flowMinimapLayout) return;
      const { positions, edges, width, height } = flowMinimapLayout;
      const mapWidth = Math.max(1, flowOverviewMinimapMap.clientWidth);
      const mapHeight = Math.max(1, flowOverviewMinimapMap.clientHeight);
      const geometry = buildMinimapGeometry(mapWidth, mapHeight, width, height, flowPan, flowOverviewZoom, { width: flowGraphRegion.clientWidth, height: flowGraphRegion.clientHeight });
      const { scale, offsetX, offsetY, viewport } = geometry;
      const make = (tag) => document.createElementNS("http://www.w3.org/2000/svg", tag);
      flowMinimapSvg.setAttribute("viewBox", "0 0 " + mapWidth + " " + mapHeight);
      flowMinimapSvg.replaceChildren();
      const group = make("g");
      group.setAttribute("transform", "translate(" + offsetX + " " + offsetY + ")");
      edges.forEach((edge) => {
        const from = positions.get(edge.source), to = positions.get(edge.target);
        if (!from || !to) return;
        const path = make("path");
        path.setAttribute("d", segmentLinkPath({ x: from.x * scale, y: from.y * scale }, { x: to.x * scale, y: to.y * scale }, from.width * scale, from.height * scale, flowOverviewLayoutDirection, 6, to.width * scale, to.height * scale));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "rgba(100,116,139,0.48)");
        path.setAttribute("stroke-width", "1");
        path.setAttribute("opacity", edge.isChoice ? "0.72" : "0.4464");
        group.appendChild(path);
      });
      positions.forEach((position, nodeId) => {
        const rect = make("rect");
        rect.setAttribute("x", position.x * scale);
        rect.setAttribute("y", position.y * scale);
        rect.setAttribute("width", position.width * scale);
        rect.setAttribute("height", position.height * scale);
        rect.setAttribute("rx", "6");
        rect.setAttribute("ry", "6");
        rect.setAttribute("shape-rendering", "crispEdges");
        const active = nodeId === (flowOverviewActiveNodeId || flowOverviewRootNodeId);
        rect.setAttribute("fill", active ? "var(--gw-accent, #625bf6)" : "#cbd5e1");
        rect.setAttribute("stroke", active ? "var(--gw-accent, #625bf6)" : "#64748b");
        rect.setAttribute("stroke-width", "1");
        group.appendChild(rect);
      });
      flowMinimapSvg.appendChild(group);
      const mask = make("path");
      mask.setAttribute("d", "M0,0h" + mapWidth + "v" + mapHeight + "h-" + mapWidth + "z M" + viewport.x + "," + viewport.y + "h" + viewport.width + "v" + viewport.height + "h-" + viewport.width + "z");
      mask.setAttribute("fill-rule", "evenodd");
      mask.setAttribute("fill", "rgba(15,23,42,0.06)");
      mask.setAttribute("pointer-events", "none");
      const rect = make("rect");
      Object.entries(viewport).forEach(([key, value]) => rect.setAttribute(key, value));
      rect.setAttribute("fill", "none");
      rect.setAttribute("stroke", "var(--gw-accent, #625bf6)");
      rect.setAttribute("stroke-width", "1.25");
      rect.setAttribute("pointer-events", "none");
      flowMinimapSvg.append(mask, rect);
    }

    function renderFlowOverviewMinimap(positionById, allEdges, canvasWidth, canvasHeight) {
      if (!flowOverviewMinimapMap) return;
      flowMinimapLayout = { positions: positionById, edges: allEdges, width: canvasWidth, height: canvasHeight };
      flowOverviewMinimapMap.replaceChildren();
      flowMinimapSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const svg = flowMinimapSvg;
      svg.style.touchAction = "none";
      const navigate = (event) => {
        const rect = svg.getBoundingClientRect();
        const width = flowOverviewMinimapMap.clientWidth, height = flowOverviewMinimapMap.clientHeight;
        const geometry = buildMinimapGeometry(width, height, canvasWidth, canvasHeight, flowPan, flowOverviewZoom, { width: flowGraphRegion.clientWidth, height: flowGraphRegion.clientHeight });
        const svgX = (event.clientX - rect.left) / Math.max(1, rect.width) * width;
        const svgY = (event.clientY - rect.top) / Math.max(1, rect.height) * height;
        const graphX = clamp((svgX - geometry.offsetX) / geometry.scale, 0, canvasWidth, 0);
        const graphY = clamp((svgY - geometry.offsetY) / geometry.scale, 0, canvasHeight, 0);
        flowPan = { x: flowGraphRegion.clientWidth / 2 - graphX * flowOverviewZoom, y: flowGraphRegion.clientHeight / 2 - graphY * flowOverviewZoom };
        applyFlowTransform();
      };
      svg.addEventListener("pointerdown", (event) => { if (event.button !== 0) return; event.preventDefault(); event.stopPropagation(); svg.setPointerCapture(event.pointerId); navigate(event); });
      svg.addEventListener("pointermove", (event) => { if (svg.hasPointerCapture(event.pointerId)) navigate(event); });
      const endDrag = (event) => { if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId); };
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);
      flowOverviewMinimapMap.appendChild(svg);
      updateFlowOverviewMinimap();
    }

    function openFlowOverview() {
      flowOverviewBackdrop.classList.add("open");
      const view = settings.flowOverviewView;
      Object.assign(flowGraphRegion.style, { inset: "auto", left: view.x + "%", top: view.y + "%", width: view.width + "%", height: view.height + "%" });
      const allNodes = Array.isArray(content.flow?.nodes) ? content.flow.nodes : content.nodes || [];
      const allEdges = Array.isArray(content.flow?.edges) ? content.flow.edges : content.edges || [];
      if (settings.surfaceAppearances?.flow) {
        gwAppearance(flowOverviewPanel, settings.surfaceAppearances.flow);
        flowOverviewViewport.style.background = 'transparent';
      } else {
        applySurfaceBackground(flowOverviewPanel, "flowOverviewBackground");
        flowOverviewViewport.style.background = 'transparent';
      }
      setFlowOverviewZoom(view.zoom, true);
      flowPan = { x: view.offsetX * flowGraphRegion.clientWidth / 100, y: view.offsetY * flowGraphRegion.clientHeight / 100 };
      flowOverviewViewport.style.setProperty("--flow-overview-minimap-width", settings.flowOverviewMinimapWidth + "px");
      flowOverviewViewport.style.setProperty("--flow-overview-minimap-height", settings.flowOverviewMinimapHeight + "px");
      if (startScreen.classList.contains("open")) stopStartMenuMusic();
      playFlowOverviewMusic();
      flowOverviewDetail.hidden = true;
      flowOverviewDetail.innerHTML = "";
      flowOverviewCanvas.innerHTML = "";
      if (!allNodes.length) {
        flowOverviewBranchLabel = content.language === "zh" ? "暂无剧情" : content.language === "ja" ? "ストーリーなし" : "No story";
        renderCustomStartMenu(null, flowOverviewCustomLayer, settings.flowOverviewElements);
        flowOverviewCanvas.textContent = labels.noStory;
        flowOverviewBackdrop.classList.add("open");
        return;
      }

      const rootNode = allNodes.find((node) => node.data && node.data.isRoot) || allNodes[0];
      flowOverviewRootNodeId = rootNode.id;
      if (!allNodes.some((node) => node.id === flowOverviewActiveNodeId)) flowOverviewActiveNodeId = rootNode.id;
      flowOverviewBranchLabel = flowNodeTitle(rootNode);
      flowOverviewEdges = allEdges;
      const positionById = layoutWebFlow(allNodes.map((node) => {
        const size = settings.flowOverviewCardSizes[node.segmentId] || settings.flowOverviewCardSizes[node.id] || {};
        return { id: node.id, targets: allEdges.filter((edge) => edge.source === node.id).map((edge) => edge.target),
          width: clamp(size.width, 140, 420, view.cardWidth), height: clamp(size.height, 90, 260, view.cardHeight) };
      }), flowOverviewLayoutDirection, view.gapX, view.gapY);
      const canvasWidth = Math.max(1040, ...Array.from(positionById.values()).map((position) => position.x + position.width + 120));
      const canvasHeight = Math.max(620, ...Array.from(positionById.values()).map((position) => position.y + position.height + 120));
      flowOverviewCanvas.style.width = canvasWidth + "px";
      flowOverviewCanvas.style.height = canvasHeight + "px";

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.className.baseVal = "flow-overview-svg";
      svg.setAttribute("width", String(canvasWidth));
      svg.setAttribute("height", String(canvasHeight));
      svg.setAttribute("viewBox", "0 0 " + canvasWidth + " " + canvasHeight);
      allEdges.forEach((edge) => {
        const from = positionById.get(edge.source);
        const to = positionById.get(edge.target);
        if (!from || !to) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", flowOverviewEdgePath(from, to));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#94a3b8");
        path.setAttribute("stroke-width", "2");
        path.classList.add("flow-overview-edge");
        path.setAttribute("data-source", edge.source);
        path.setAttribute("data-target", edge.target);
        svg.appendChild(path);
      });
      flowOverviewCanvas.appendChild(svg);
      renderFlowOverviewMinimap(positionById, allEdges, canvasWidth, canvasHeight);
      renderCustomStartMenu(null, flowOverviewCustomLayer, settings.flowOverviewElements);

      allNodes.forEach((node) => {
        const position = positionById.get(node.id);
        const card = document.createElement("div");
        const locked = !(node.nodeIds || [node.id]).some(flowNodeIsWatched);
        card.className = "flow-overview-node" + (node.id === rootNode.id ? " root" : "") + (locked ? " is-locked" : "");
        card.style.left = position.x + "px";
        card.style.top = position.y + "px";
        card.style.width = (position.width || 220) + "px";
        card.style.height = (position.height || 132) + "px";
        card.setAttribute("data-node-id", node.id);
        const imageUrl = flowNodeImage(node);
        if (imageUrl) {
          const image = document.createElement("img");
          image.className = "flow-overview-node-image";
          image.src = imageUrl;
          image.alt = "";
          card.appendChild(image);
        } else {
          card.classList.add("no-image");
        }
        if (locked) {
          const lock = document.createElement("span");
          lock.className = "flow-overview-node-lock";
          lock.setAttribute("aria-hidden", "true");
          lock.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="12" x="4" y="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
          card.appendChild(lock);
        }
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", (content.language === "zh" ? "查看并从此处开始：" : "View and play from: ") + flowNodeTitle(node) + (locked ? (content.language === "zh" ? "（未解锁）" : " (locked)") : ""));
        card.addEventListener("click", () => showFlowNodeDetail(node));
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            showFlowNodeDetail(node);
          }
        });
        flowOverviewCanvas.appendChild(card);
      });
      flowOverviewBackdrop.classList.add("open");
      applyFlowTransform();
    }

    let isTransitioning = false;

    function getPresentationTransform(type, isExit) {
      if (type === 'slide-left' || type === 'slideLeft') {
        return 'translateX(' + (isExit ? '-120%' : '100%') + ')';
      }
      if (type === 'slide-right' || type === 'slideRight') {
        return 'translateX(' + (isExit ? '120%' : '-100%') + ')';
      }
      if (type === 'slide-up' || type === 'slideUp') {
        return 'translateY(' + (isExit ? '-120%' : '100%') + ')';
      }
      if (type === 'slide-down' || type === 'slideDown') {
        return 'translateY(' + (isExit ? '120%' : '-100%') + ')';
      }
      if (type === 'zoom') return 'scale(0.82)';
      return '';
    }

    function getCharacterMotionTransform(type, isExit) {
      if (type === 'slide-left') return 'translateX(calc(' + (isExit ? '-100cqw -' : '100cqw +') + ' 100%))';
      if (type === 'slide-right') return 'translateX(calc(' + (isExit ? '100cqw +' : '-100cqw -') + ' 100%))';
      if (type === 'slide-up') return 'translateY(calc(' + (isExit ? '-100cqh -' : '100cqh +') + ' 100%))';
      if (type === 'slide-down') return 'translateY(calc(' + (isExit ? '100cqh +' : '-100cqh -') + ' 100%))';
      return getPresentationTransform(type, isExit);
    }

    function goTo(id) {
      if (!storyPlaybackActive() || isTransitioning) return;
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      
      const node = nodeById.get(currentId);

    if (hint && element.settingsDescription !== void 0) hint.textContent = element.settingsDescription;
    row.querySelectorAll("input,button").forEach((control) => {

      if (element.disabled) {
        control.disabled = true;
        locks.add(control);
      }

  const groups = Array.from(panel.querySelectorAll(".gw-ps-group"));
  groups.forEach((group) => {
    group.hidden = Array.from(group.querySelectorAll("[data-setting-role]")).every(
      (row) => row.hidden
    );
  });
  const columns = panel.querySelector(".gw-ps-columns");
  if (columns) {
    columns.hidden = groups.every((group) => group.hidden);
    columns.style.gridTemplateColumns = groups.filter((group) => !group.hidden).length === 1 ? "1fr" : "";
  }
  const closeButton = panel.querySelector('[data-action="close"]');
  if (closeButton) closeButton.hidden = false;
  const replay = () => {
    clearTimeout(timer);
    if (!sample) return;
    const text = Array.from(sample.dataset.sample || "");
    sample.textContent = "";
    let index = 0;
    const tick = () => {
      if (values.interactionMode === "immediate") index = text.length;
      else index += 1;
      sample.textContent = text.slice(0, index).join("");
      if (index < text.length) timer = setTimeout(tick, values.typewriterSpeed);
    };
    tick();
  };
  const sync = (next) => {

    values = { musicVolume: 100, voiceVolume: 100, ...next };
    if (testAudio) {

      testAudio.muted = !values.soundEnabled;
    }
    panel.querySelectorAll("[data-setting]").forEach((control) => {
      const key = control.dataset.setting;
      const value = values[key];

        );

        const output = panel.querySelector(`[data-value="${key}"]`);
        const displayValue = control.dataset.invert === "true" ? (Number(value) <= 50 ? panel.dataset.speedFast : Number(value) <= 110 ? panel.dataset.speedStandard : panel.dataset.speedSlow) || "" : `${value}${output?.dataset.unit || ""}`;

      (button) => button.setAttribute("aria-pressed", String(button.dataset.mode === values.interactionMode))
    );

        String(
          values[button.dataset.settingChoice] === (button.dataset.choice === "true")
        )
      );
    });

    if (modeSelect) modeSelect.value = values.interactionMode;
    panel.querySelectorAll("[data-step-setting]").forEach((button) => {
      const field = panel.querySelector(
        `input[data-setting="${button.dataset.stepSetting}"]`
      );
      const current = Number(field.value);
      button.disabled = locks.has(button) || field.disabled || (Number(button.dataset.delta) < 0 ? current <= Number(field.min) : current >= Number(field.max));
    });
    panel.querySelectorAll("[data-test-volume]").forEach((button) => {
      button.disabled = locks.has(button) || !values.soundEnabled;
    });
    panel.querySelectorAll("[data-text-scale]").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.textScale) === values.textScale)));

  const change = (patch) => {
    sync({ ...values, ...patch });
    onChange(patch);
    const status = panel.querySelector("[data-status]");
    if (status) status.textContent = panel.dataset.saved;
  };
  const input = (event) => {
    const field = event.target;
    if (field instanceof HTMLSelectElement && field.hasAttribute("data-mode-select")) {

    }

  };

    const button = event.target.closest("button");
    if (!button || button.disabled) return;
    if (button.dataset.action === "close") onClose();
    else if (button.dataset.action === "replay") replay();
    else if (button.dataset.testVolume) {
      document.dispatchEvent(new Event("gw-stop-volume-test"));
      testVolumeKey = button.dataset.testVolume;
      testAudio = new Audio(panel.dataset.testAudio);
      testAudio.volume = Math.max(0, Math.min(100, Number(values[testVolumeKey]) || 0)) / 100;
      testAudio.muted = !values.soundEnabled;
      void testAudio.play().catch(() => void 0);
    } else if (button.dataset.action === "reset") {
      beforeReset = { ...values };
      change({ musicVolume: 100, voiceVolume: 100, ...defaults });
      replay();

      if (status) status.textContent = panel.dataset.resetDone;
      const undo = panel.querySelector('[data-action="undo-reset"]');
      if (undo) undo.hidden = false;
    } else if (button.dataset.action === "undo-reset" && beforeReset) {

      beforeReset = void 0;
      button.hidden = true;
      const status = panel.querySelector("[data-status]");
      if (status) status.textContent = panel.dataset.undoDone;
    } else if (button.dataset.textScale) {
      change({ textScale: Number(button.dataset.textScale) });
    } else if (button.dataset.mode) {
      change({ interactionMode: button.dataset.mode });
      replay();
    } else if (button.dataset.settingChoice) {
      change({ [button.dataset.settingChoice]: button.dataset.choice === "true" });
    } else if (button.dataset.stepSetting) {
      const field = panel.querySelector(
        `input[data-setting="${button.dataset.stepSetting}"]`
      );
      const next = Math.max(
        Number(field.min),
        Math.min(
          Number(field.max),
          Number(field.value) + Number(button.dataset.delta) * Number(field.step)
        )
      );
      change({ [button.dataset.stepSetting]: next });

      change({ [key]: !values[key] });
    }

  root.addEventListener("change", input);
  root.addEventListener("click", click);
  document.addEventListener("gw-stop-volume-test", stopVolumeTest);
  sync(values);
  replay();
  return {
    sync,
    destroy: () => {
      clearTimeout(timer);
      stopVolumeTest();
      document.removeEventListener("gw-stop-volume-test", stopVolumeTest);
      root.removeEventListener("input", input);
      root.removeEventListener("change", input);
      root.removeEventListener("click", click);
    }
  };
});
    settingsBackdrop.addEventListener("click", (event) => {
      if (event.target === settingsBackdrop || event.target === playerSettingsRoot) closeSettingsPanel();
    });
    settingsBackdrop.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { event.preventDefault(); closeSettingsPanel(); return; }
      if (event.key !== "Tab") return;
      const items = Array.from(settingsBackdrop.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), a[href]')).filter((item) => item.getClientRects().length);
      const first = items[0], last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    });
    playlistButton.addEventListener("click", () => {
      const open = !playlistBackdrop.classList.contains("open");
      if (open) pauseStoryForPopup();
      playlistBackdrop.classList.toggle("open", open);
      playlistButton.setAttribute("aria-expanded", String(open));
      if (!open) { playlistAudio.pause(); resumeStoryAfterPopup(); }
      updatePlaybackToolbar();
    });
    playlistClose.addEventListener("click", () => playlistButton.click());
